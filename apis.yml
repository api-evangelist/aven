name: Aven
description: 'Aven is a consumer fintech that issues a home-equity-backed Visa credit
  card, letting homeowners tap their home equity (a HELOC) through a card with credit-card
  convenience at lower, home-equity-secured rates. Its product line spans the Aven
  HELOC card, a Bitcoin-backed Visa card, and educational tooling such as a payment
  calculator, positioning itself as an AI-driven "machine bank." Founded in the fintech
  sector and backed by Electric Capital, Founders Fund, General Catalyst, GGV Capital,
  and Khosla Ventures, Aven operates a consumer marketing and account-servicing web
  presence at aven.com. As of this enrichment pass Aven publishes no public developer
  API, developer portal, OpenAPI/AsyncAPI specification, SDKs, or MCP server; this
  profile captures its verifiable public identity and domain-security posture.'
